services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: handa_test
      POSTGRES_USER: handa_test
      POSTGRES_PASSWORD: handa_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handa_test -d handa_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
